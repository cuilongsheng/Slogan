name: Android delivery
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-delivery-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_API_BASE_URL: https://slogan-api-pi.vercel.app
      SLOGAN_RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SLOGAN_ANDROID_VERSION_NAME: 0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set monotonic Android version
        run: echo "SLOGAN_ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check delivery and mobile code
        run: |
          node --test scripts/tests/release-delivery.test.mjs scripts/tests/pages-proxy.test.mjs
          pnpm --filter @slogan/mobile typecheck
          pnpm --filter @slogan/mobile lint
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android SDK and native app
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
          pnpm --filter @slogan/mobile exec expo prebuild --platform android --no-install --clean --skip-dependency-update react,react-native,expo
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Build arm64 release variant
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --stacktrace --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Verify actual APK and generate metadata
        run: node scripts/release/verify-android.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Explain build output
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo 'APK and SHA-256 metadata are attached to this run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production download is updated only after main deployment checks succeed.' >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
      checks: read
      statuses: read
    concurrency:
      group: android-production-publish
      cancel-in-progress: false
    env:
      SLOGAN_RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-${{ github.sha }}
          path: release-artifacts/
      - name: Wait for matching production API and both Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/deployment-gate.mjs
      - name: Publish verified APK and update latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/publish-android.mjs

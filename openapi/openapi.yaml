  /v1/rooms/{roomId}/reports:
    post:
      operationId: ReportsController_submit
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                category:
                  enum:
                    - HARASSMENT_ABUSE
                    - HATE_DISCRIMINATION
                    - SEXUAL_CONTENT
                    - SPAM_ADVERTISING
                    - OTHER
                  type: string
                clientRequestId:
                  description: Idempotency identifier scoped to the authenticated reporter. Reuse only for equivalent normalized content.
                  format: uuid
                  type: string
                description:
                  description: Plain text. Trimmed before validation; 1–2000 Unicode code points. Never included in response or audit.
                  maxLength: 2000
                  minLength: 1
                  type: string
                targetUserId:
                  format: uuid
                  type: string
              required:
                - targetUserId
                - clientRequestId
                - category
                - description
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  caseId:
                    format: uuid
                    type: string
                  id:
                    format: uuid
                    type: string
                  submittedAt:
                    description: First submission server time, retained on retries.
                    format: date-time
                    type: string
                required:
                  - id
                  - caseId
                  - submittedAt
                type: object
          description: New submissions and equivalent retries both return the original minimal receipt.
        "400":
          content:
            application/json:
              schema:
                properties:
                  code:
                    example: VALIDATION_FAILED
                    type: string
                  details:
                    type: object
                  message:
                    example: Request validation failed
                    type: string
                  requestId:
                    example: 5b27b1e0-f183-46f6-b9e8-1421235a8bb1
                    type: string
                required:
                  - code
                  - message
                type: object
          description: VALIDATION_FAILED or REPORT_TARGET_INVALID
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    example: VALIDATION_FAILED
                    type: string
                  details:
                    type: object
                  message:
                    example: Request validation failed
                    type: string
                  requestId:
                    example: 5b27b1e0-f183-46f6-b9e8-1421235a8bb1
                    type: string
                required:
                  - code

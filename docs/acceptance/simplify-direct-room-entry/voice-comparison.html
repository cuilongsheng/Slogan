<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>Slogan voice room: original design and runtime comparison</title>
  <style>
    body {
      margin: 24px;
      font: 16px system-ui;
      background: #f1f4fb;
      color: #251d3b;
    }
    .pair {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }
    figure {
      margin: 0;
    }
    figcaption {
      margin: 12px 0;
    }
    img {
      width: 390px;
      height: 844px;
      display: block;
    }
    .overlay {
      position: relative;
      width: 390px;
      height: 844px;
    }
    .overlay img:last-child {
      position: absolute;
      inset: 0;
      opacity: 0.5;
    }
    label {
      display: block;
      margin: 16px 0;
    }
  </style>
  <h1>Original Figma design and actual running component</h1>
  <p>02 UI · 115:1425 · 390×844. This is a Web-fixture comparison; Android device verification is separate. Both images are displayed unchanged.</p>
  <div class="pair">
    <figure>
      <figcaption>Original exported through Desktop Bridge</figcaption>
      <img src="voice-original-figma.png" alt="原始语音房设计" />
    </figure>
    <figure>
      <figcaption>Final running component with explicit fixture data</figcaption>
      <img src="voice-runtime-web-fixture.png" alt="最终语音房运行" />
    </figure>
  </div>
  <h2>Opacity overlay</h2>
  <label>Runtime image opacity <input id="opacity" type="range" min="0" max="100" value="50" /></label>
  <div class="overlay">
    <img src="voice-original-figma.png" alt="原稿底图" /><img
      id="runtime"
      src="voice-runtime-web-fixture.png"
      alt="运行叠图"
    />
  </div>
  <script>
    document.getElementById('opacity').addEventListener('input', (event) => {
      document.getElementById('runtime').style.opacity = event.target.value / 100;
    });
  </script>
</html>

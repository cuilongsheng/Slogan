services:
  postgres-test:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: slogan_test
      POSTGRES_PASSWORD: slogan
      POSTGRES_USER: slogan
    ports:
      - '127.0.0.1:54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slogan -d slogan_test']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
  redis-test:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data
